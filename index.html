<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#111" />
<title>Pixel Sort</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="Drag to sort pixels. Tap or press Space to hold or release the camera. R changes the effect. S saves an image."></canvas>
<div id="start"><button id="camera-button" disabled>start camera</button><span>or drop an image</span></div>
<input id="file-input" type="file" accept="image/*" hidden />
<div id="hint" hidden>drag to pull · tap to hold</div>
<div id="status" role="status">loading</div>
<div id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
